include: '/templates/_common.gitlab-ci.yml'

image: ${CI_RENOVATE_IMAGE}

services:
  - name: ${CI_RENOVATE_SERVICE}
    alias: docker

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_CERT_PATH: /certs/client
  CI_RENOVATE_SERVICE: docker:20.10.17-dind@sha256:c10de736621bc2d4a3a44297346640b62309db58f46822b87679d9419a6b321c
  CI_RENOVATE_IMAGE: renovate/renovate:32.143.0-slim@sha256:aa058ba5c32b3631b9507da37f9817ef93c49c67b2fca75bcde9e7005c657864
